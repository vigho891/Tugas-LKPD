<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Ekskul RPL</title>
</head>
<body>

    <h2>Formulir Pendaftaran Ekskul RPL</h2>

    <form action="#" method="POST">
        
        <label for="nama">Nama Lengkap:</label><br>
        <input type="text" id="nama" name="nama" placeholder="Ketik namamu di sini"><br><br>

        
        <label for="tanggal_lahir">Tanggal Lahir:</label><br>
        <input type="date" id="tanggal_lahir" name="tanggal_lahir"><br><br>

        
        <label for="nohp">Nomor HP/WA:</label><br>
        <input type="number" id="nohp" name="nohp"><br><br>

        
        <button type="submit">Daftar</button>
    </form>

</body>
</html>
