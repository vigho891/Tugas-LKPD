<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <style>
    body {
      background-color: #f4f4f4;
      font-family: Arial, sans-serif;
    }

    .kartu {
      background-color: white;
      width: 300px; 
      margin: 50px auto;
      padding: 20px;
      border-radius: 10px; 
      text-align: center;
      border: 1px solid #ddd;
    }

    .foto {
      border-radius: 50%; 
      width: 150px;
      height: 150px;
    }

    .pekerjaan {
      color: gray;
      margin-top: -10px; 
    }

    
    .btn-kontak {
      background-color: #007bff;
      color: white; 
      padding: 10px 20px;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="kartu">
    <img src="Tugas1.webp" alt="Foto Profil" class="foto">
    <h2>Ahmad Vigho</h2>
    <p class="pekerjaan">Software Engineer</p>
    <p>Siswa XI RPL berkeinginan menjadi gamemaker.</p>
    <button class="btn-kontak">Hubungi Saya</button>
</div>

</body>
</html>
